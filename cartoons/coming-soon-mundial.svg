<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Georgia, serif">
  <rect width="800" height="600" fill="#f5f0e8"/>
  <!-- lined paper -->
  <defs>
    <pattern id="lines" x="0" y="0" width="800" height="32" patternUnits="userSpaceOnUse">
      <line x1="0" y1="31.5" x2="800" y2="31.5" stroke="#d8d0be" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#lines)"/>
  <!-- red margin line -->
  <line x1="80" y1="0" x2="80" y2="600" stroke="#e8a0a0" stroke-width="1.5"/>
  <!-- border -->
  <rect x="12" y="12" width="776" height="576" fill="none" stroke="#1a1714" stroke-width="3"/>
  <!-- badge -->
  <rect x="280" y="60" width="240" height="32" fill="#1a1714"/>
  <text x="400" y="81" text-anchor="middle" fill="#f5f0e8" font-family="'Courier New', monospace" font-size="11" letter-spacing="3">COMING SOON</text>
  <!-- series label -->
  <text x="400" y="160" text-anchor="middle" fill="#c8392b" font-family="Georgia, serif" font-size="48" font-weight="bold" font-style="italic">Mundial 2026</text>
  <!-- guanaco simple -->
  <ellipse cx="400" cy="360" rx="50" ry="65" fill="#c8a96e" stroke="#1a1714" stroke-width="2"/>
  <ellipse cx="400" cy="295" rx="22" ry="28" fill="#c8a96e" stroke="#1a1714" stroke-width="2"/>
  <path d="M382 310 Q378 285 383 268" stroke="#1a1714" stroke-width="2" fill="none"/>
  <path d="M418 310 Q422 285 417 268" stroke="#1a1714" stroke-width="2" fill="none"/>
  <path d="M385 278 Q378 260 381 253 Q387 261 385 272" fill="#c8a96e" stroke="#1a1714" stroke-width="1.5"/>
  <path d="M415 278 Q422 260 419 253 Q413 261 415 272" fill="#c8a96e" stroke="#1a1714" stroke-width="1.5"/>
  <circle cx="393" cy="290" r="4" fill="#1a1714"/>
  <circle cx="407" cy="290" r="4" fill="#1a1714"/>
  <circle cx="394.2" cy="288.5" r="1.2" fill="#fff"/>
  <circle cx="408.2" cy="288.5" r="1.2" fill="#fff"/>
  <ellipse cx="400" cy="305" rx="7" ry="5" fill="#b89055" stroke="#1a1714" stroke-width="1"/>
  <rect x="372" y="418" width="14" height="28" rx="4" fill="#b89055" stroke="#1a1714" stroke-width="1.5"/>
  <rect x="390" y="421" width="14" height="25" rx="4" fill="#b89055" stroke="#1a1714" stroke-width="1.5"/>
  <rect x="408" y="421" width="14" height="25" rx="4" fill="#b89055" stroke="#1a1714" stroke-width="1.5"/>
  <rect x="426" y="418" width="14" height="28" rx="4" fill="#b89055" stroke="#1a1714" stroke-width="1.5"/>
  <ellipse cx="400" cy="370" rx="26" ry="34" fill="#e8d5a8" stroke="none"/>
  <!-- speech bubble -->
  <rect x="100" y="290" width="220" height="70" rx="8" fill="#fff" stroke="#1a1714" stroke-width="2"/>
  <polygon points="270,340 290,360 295,335" fill="#fff" stroke="#1a1714" stroke-width="2"/>
  <text x="210" y="318" text-anchor="middle" fill="#1a1714" font-family="Georgia, serif" font-style="italic" font-size="13">"Esto lo vi venir</text>
  <text x="210" y="338" text-anchor="middle" fill="#1a1714" font-family="Georgia, serif" font-style="italic" font-size="13">hace cuatro años."</text>
  <!-- footer -->
  <text x="400" y="555" text-anchor="middle" fill="#7a7265" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">WANAKI CARTOONS</text>
</svg>
