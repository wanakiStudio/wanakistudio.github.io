<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Georgia, serif">
  <rect width="800" height="600" fill="#f5f0e8"/>
  <defs>
    <pattern id="lines" x="0" y="0" width="800" height="32" patternUnits="userSpaceOnUse">
      <line x1="0" y1="31.5" x2="800" y2="31.5" stroke="#d8d0be" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#lines)"/>
  <line x1="80" y1="0" x2="80" y2="600" stroke="#e8a0a0" stroke-width="1.5"/>
  <rect x="12" y="12" width="776" height="576" fill="none" stroke="#1a1714" stroke-width="3"/>
  <rect x="260" y="60" width="280" height="32" fill="#1a1714"/>
  <text x="400" y="81" text-anchor="middle" fill="#f5f0e8" font-family="'Courier New', monospace" font-size="11" letter-spacing="3">ARCHIVE — EST. 2000</text>
  <text x="400" y="150" text-anchor="middle" fill="#1a1714" font-family="Georgia, serif" font-size="38" font-weight="bold">200+ Cartoons.</text>
  <text x="400" y="195" text-anchor="middle" fill="#c8392b" font-family="Georgia, serif" font-size="38" font-weight="bold" font-style="italic">Dusting off the archive.</text>
  <!-- 4 mini panel grid -->
  <rect x="130" y="230" width="240" height="160" fill="#fff" stroke="#1a1714" stroke-width="2"/>
  <line x1="250" y1="230" x2="250" y2="390" stroke="#1a1714" stroke-width="1.5"/>
  <line x1="130" y1="310" x2="370" y2="310" stroke="#1a1714" stroke-width="1.5"/>
  <text x="190" y="278" text-anchor="middle" fill="#7a7265" font-family="'Courier New', monospace" font-size="28">👔</text>
  <text x="310" y="278" text-anchor="middle" fill="#7a7265" font-family="'Courier New', monospace" font-size="28">💻</text>
  <text x="190" y="358" text-anchor="middle" fill="#7a7265" font-family="'Courier New', monospace" font-size="28">📊</text>
  <text x="310" y="358" text-anchor="middle" fill="#7a7265" font-family="'Courier New', monospace" font-size="28">🦙</text>
  <!-- stacked panels suggestion -->
  <rect x="390" y="240" width="240" height="150" fill="#ede7d5" stroke="#1a1714" stroke-width="1.5"/>
  <rect x="400" y="250" width="240" height="150" fill="#e6dfd0" stroke="#1a1714" stroke-width="1.5"/>
  <rect x="410" y="260" width="240" height="150" fill="#fff" stroke="#1a1714" stroke-width="2"/>
  <text x="530" y="345" text-anchor="middle" fill="#7a7265" font-family="'Courier New', monospace" font-size="13">More strips</text>
  <text x="530" y="362" text-anchor="middle" fill="#7a7265" font-family="'Courier New', monospace" font-size="13">coming soon</text>
  <text x="400" y="555" text-anchor="middle" fill="#7a7265" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">WANAKI CARTOONS</text>
</svg>
